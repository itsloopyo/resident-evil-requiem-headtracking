; RE9 Head Tracking Configuration
; Delete this file to reset to defaults

[Network]
; UDP port for OpenTrack data (default: 4242)
UDPPort=4242

[Sensitivity]
; Rotation sensitivity multipliers (1.0 = 1:1)
YawMultiplier=1
PitchMultiplier=1
RollMultiplier=1

[Smoothing]
; Smoothing applied when the tracker runs on this machine (loopback).
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
LocalSmoothing=0
; Smoothing applied when the tracker is a remote device on the network.
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
RemoteSmoothing=0.15

[Position]
; Position tracking sensitivity (0.1-10.0, higher = more movement)
SensitivityX=1
SensitivityY=1
SensitivityZ=1
; Position limits in meters
LimitX=0.3
LimitY=0.2
LimitZ=0.4
LimitZBack=0.1
Enabled=true

[Flashlight]
; Head tracking moves the flashlight beam as well as the view.
Enabled=true
; How far the beam leads the view (1.0 = matches the head, 1.5 = default)
Multiplier=1.5

[Hotkeys]
; Virtual key codes (hex)
ToggleKey=0x23    ; End
PositionToggleKey=0x21 ; Page Up
YawModeKey=0x22      ; Page Down - toggle world/local yaw
[General]
AutoEnable=true
; Yaw mode: false = camera-local, true = horizon-locked (default)
WorldSpaceYaw=true
